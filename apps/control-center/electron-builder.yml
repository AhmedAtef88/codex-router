appId: io.github.codex-router.control-center
productName: Codex Router
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
electronFuses:
  # The packaged Electron executable intentionally runs the trusted installed
  # router entrypoints in Node mode; command-runner.mjs depends on this fuse.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
extraResources:
  - from: ../desktop/src-tauri/icons/icon.png
    to: icon.png
mac:
  category: public.app-category.developer-tools
  icon: ../desktop/src-tauri/icons/icon.png
  target: [dmg, zip]
linux:
  icon: ../desktop/src-tauri/icons/icon.png
  category: Development
  executableName: codex-router-control-center
  target: [AppImage]
win:
  icon: ../desktop/src-tauri/icons/icon.ico
  target: [nsis]
